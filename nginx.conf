server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint polled by the Docker HEALTHCHECK and the VPS deployer
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The SPA shell must never be cached, or a deploy keeps serving stale asset refs
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CRA emits content-hashed filenames under /static, safe to cache forever
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
