name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/portfolio:$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify VPS dashboard
        run: |
          URL=$(printf '%s' "${{ secrets.WEBHOOK_URL }}" | tr -d '[:space:]')
          TS=$(date +%s)
          BODY=$(jq -nc \
            --arg image "${{ steps.meta.outputs.image }}" \
            --arg sha "${{ steps.meta.outputs.sha }}" \
            --argjson ts "$TS" \
            '{ image: $image, sha: $sha, ts: $ts }')
          SIG="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')"
          curl -sf -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $SIG" \
            -d "$BODY"
