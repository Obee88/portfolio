name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order. Two pushes seconds apart used to build in
# parallel, and the older image could land on the VPS last.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/portfolio:$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify VPS dashboard
        env:
          URL: ${{ secrets.WEBHOOK_URL }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SHA: ${{ steps.meta.outputs.sha }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          TS=$(date +%s)
          BODY=$(jq -nc \
            --arg sha "$SHA" \
            --arg ref "$GITHUB_REF" \
            --arg image "$IMAGE" \
            --argjson ts "$TS" \
            '{sha: $sha, ref: $ref, image: $image, timestamp: $ts}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -binary | xxd -p -c 256)
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$SIG" \
            -d "$BODY"
